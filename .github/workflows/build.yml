name: Build (Windows + macOS)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Testes do back-end
        if: matrix.platform == 'windows-latest'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri
        run: npx tauri build ${{ matrix.args }}

      - name: Executável portátil (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $exe = Get-ChildItem "src-tauri/target/release/*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Copy-Item $exe.FullName "out/Claude + Codex Usage.exe"
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" out/
          Copy-Item "src-tauri/target/release/bundle/msi/*.msi" out/

      - name: Pacotes (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p out
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg out/

      - uses: actions/upload-artifact@v4
        with:
          name: claude-usage-${{ matrix.platform }}
          path: out/*

  # Só em tags v*: junta os arquivos dos dois sistemas e anexa à release do GitHub.
  # Se a release ainda não existe, cria uma com as notas geradas dos commits; se você
  # já criou a sua (com notas próprias), só anexa os arquivos.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: claude-usage-*
          path: dist
          merge-multiple: true

      - name: Nomes sem espaços
        run: |
          mkdir -p assets
          cp "dist/Claude + Codex Usage.exe" assets/Claude-Codex-Usage.exe
          cp dist/*.dmg assets/Claude-Codex-Usage_macOS_universal.dmg
          ls -l assets

      - name: Anexar à release
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1             || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Claude + Codex Usage $TAG" --generate-notes
          gh release upload "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --clobber
