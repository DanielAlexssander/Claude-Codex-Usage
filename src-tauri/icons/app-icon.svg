<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34363A"/>
      <stop offset="0.55" stop-color="#1D1E21"/>
      <stop offset="1" stop-color="#0E0F11"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.24" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- medidor: laranja do Claude à esquerda, azul do Codex à direita -->
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="130" y1="0" x2="894" y2="0">
      <stop offset="0" stop-color="#F0996F"/>
      <stop offset="0.4" stop-color="#D97757"/>
      <stop offset="0.6" stop-color="#4E9FEA"/>
      <stop offset="1" stop-color="#7CC4FF"/>
    </linearGradient>
    <linearGradient id="orange" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#F29D78"/>
      <stop offset="1" stop-color="#D2623F"/>
    </linearGradient>
    <linearGradient id="white" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE1E8"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <path id="petal" d="M1107.3 299.1c-197.999 0-373.9 127.3-435.2 315.3L650 743.5v427.9c0 21.4 11 40.4 29.4 51.4l344.5 198.515V833.3h.1v-27.9L1372.7 604c33.715-19.52 70.44-32.857 108.47-39.828L1447.6 450.3C1361 353.5 1237.1 298.5 1107.3 299.1zm0 117.5-.6.6c79.699 0 156.3 27.5 217.6 78.4-2.5 1.2-7.4 4.3-11 6.1L952.8 709.3c-18.4 10.4-29.4 30-29.4 51.4V1248l-155.1-89.4V755.8c-.1-187.099 151.601-338.9 339-339.2z"/>
  </defs>

  <!-- base -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#glow)"/>
  <rect x="65.5" y="65.5" width="893" height="893" rx="206.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="3"/>

  <!-- medidor: trilha + progresso -->
  <path d="M 241.9 782.1 A 382 382 0 1 1 782.1 782.1" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="30" stroke-linecap="round"/>
  <path d="M 241.9 782.1 A 382 382 0 1 1 857.6 349.4" fill="none" stroke="url(#ring)" stroke-width="30" stroke-linecap="round"/>
  <circle cx="857.6" cy="349.4" r="52" fill="url(#halo)"/>
  <circle cx="857.6" cy="349.4" r="22" fill="#FFFFFF"/>

  <!-- sombras dos discos -->
  <circle cx="352" cy="534" r="170" fill="#000000" fill-opacity="0.45" filter="url(#soft)"/>
  <circle cx="672" cy="534" r="170" fill="#000000" fill-opacity="0.45" filter="url(#soft)"/>

  <!-- Claude: disco laranja com o mascote do Claude Code -->
  <circle cx="352" cy="512" r="170" fill="url(#orange)"/>
  <circle cx="352" cy="512" r="168.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="3"/>
  <g transform="translate(241.6 397.0) scale(9.2)">
    <path clip-rule="evenodd" fill-rule="evenodd" fill="#FFF6F0" d="M20.998 10.949H24v3.102h-3v3.028h-1.487V20H18v-2.921h-1.487V20H15v-2.921H9V20H7.488v-2.921H6V20H4.487v-2.921H3V14.05H0V10.95h3V5h17.998v5.949zM6 10.949h1.488V8.102H6v2.847zm10.51 0H18V8.102h-1.49v2.847z"/>
  </g>

  <!-- ChatGPT / Codex: disco branco com a flor (sobrepõe o do Claude, separado por um filete escuro) -->
  <circle cx="672" cy="512" r="184" fill="#1D1E21"/>
  <circle cx="672" cy="512" r="170" fill="url(#white)"/>
  <g transform="translate(534.04 374.04) scale(0.11468)" fill="#17181B">
    <use xlink:href="#petal"/>
    <use xlink:href="#petal" transform="rotate(60 1203 1203)"/>
    <use xlink:href="#petal" transform="rotate(120 1203 1203)"/>
    <use xlink:href="#petal" transform="rotate(180 1203 1203)"/>
    <use xlink:href="#petal" transform="rotate(240 1203 1203)"/>
    <use xlink:href="#petal" transform="rotate(300 1203 1203)"/>
  </g>
</svg>
