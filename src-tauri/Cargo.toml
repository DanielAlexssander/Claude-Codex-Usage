[package]
name = "claude-usage"
version = "1.0.0"
description = "Widget de uso do Claude Code para qualquer assinatura (Pro, Max, Team, Enterprise)"
authors = ["Claude Usage"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "claude_usage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "rustls-tls-webpki-roots", "gzip"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
dirs = "6"
walkdir = "2"
log = "0.4"
portable-pty = "0.9"
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
